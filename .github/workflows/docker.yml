name: Docker

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ── Lint & Typecheck ──────────────────────────────────────────
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.10
        # version auto-read from packageManager field

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

  # ── Build & test (native platform, all triggers) ───────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: calino:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test

      - name: Start container
        run: |
          docker run -d --name calino-test \
            -p 8080:8080 \
            --tmpfs /tmp:rw,noexec,nosuid \
            --health-cmd 'wget -qO- http://localhost:8080/ || exit 1' \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 5 \
            calino:test

      - name: Wait for healthy
        run: |
          echo "Waiting for container to become healthy..."
          timeout 30 bash -c '
            until docker inspect --format="{{.State.Health.Status}}" calino-test 2>/dev/null | grep -q healthy; do
              sleep 2
            done
          '
          echo "✅ Container is healthy"

      - name: Verify SPA response
        run: |
          # Root should return 200 with HTML
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/ || echo '000')
          if [ "$STATUS" != "200" ]; then
            echo "❌ Root returned $STATUS, expected 200"
            exit 1
          fi
          echo "✅ Root returns 200"

          # SPA route should also return 200 (Caddy fallback)
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/week || echo '000')
          if [ "$STATUS" != "200" ]; then
            echo "❌ /week returned $STATUS, expected 200"
            exit 1
          fi
          echo "✅ SPA route /week returns 200"

          # Verify security headers
          HEADERS=$(curl -s -I http://localhost:8080/ || echo '')
          for HEADER in "X-Frame-Options" "X-Content-Type-Options" "Referrer-Policy" "Permissions-Policy"; do
            if echo "$HEADERS" | grep -qi "$HEADER"; then
              echo "✅ $HEADER present"
            else
              echo "❌ $HEADER missing"
              exit 1
            fi
          done

          # Verify server header is stripped (Caddy config removes it)
          if echo "$HEADERS" | grep -qi '^Server:'; then
            echo "❌ Server header present — should be stripped"
            exit 1
          fi
          echo "✅ Server header stripped"

      - name: Dump logs on failure
        if: failure()
        run: docker logs calino-test

      - name: Cleanup
        if: always()
        run: docker rm -f calino-test

  # ── Publish to GHCR (release tags only, native per-arch runners) ──
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            slug: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            slug: linux-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── GHCR login (release tags only) ────────────────────────
      # Publishing is gated to tag pushes so a release produces exactly ONE
      # GHCR deployment. release.sh pushes both the branch (main) and the
      # version tag (v*) for a release; if plain branch pushes also
      # published, that would be a second, redundant deployment of the same
      # commit (this used to happen — see ci(docker) history for the
      # disjoint-tag-set workaround that avoided a race but didn't remove
      # the duplicate deployment). Branch pushes and PRs still run the full
      # build + healthcheck test in the `test` job above, just without
      # pushing to GHCR. Each matrix leg here pushes an untagged image by
      # digest only (`push-by-digest`) — tags are applied exactly once, in
      # the `merge` job below, so the multi-arch manifest list is still a
      # single deployment.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/ivan-malinovski/calino,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=build-${{ matrix.slug }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Assemble multi-arch manifest & publish tags ─────────────────
  merge:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Pinned lowercase image name so every tag (semver, sha, latest, main)
          # always lands in the single canonical GHCR package, regardless of any
          # future repo rename or owner-casing change.
          images: ghcr.io/ivan-malinovski/calino
          # Only reached on a version-tag push (see the `if:` above), so this
          # is the release's one and only tag set — no `edge`/branch tags to
          # keep disjoint from anymore.
          #
          # `latest` and `main` are what a self-hoster's `docker pull` and
          # every unpinned compose file resolve to, so they must only ever
          # move to a stable release. A prerelease tag (`v0.27.0-beta.1` —
          # anything with a SemVer hyphen) publishes under its own version
          # tag only, and leaves the moving tags pointing at the last stable.
          # This used to be unconditional, which meant tagging a beta shipped
          # it to everyone running `:latest`.
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=raw,value=main,enable=${{ !contains(github.ref_name, '-') }}
            type=sha,prefix=sha-,format=short

      - name: Create manifest list & push
        working-directory: /tmp/digests
        run: |
          # Word splitting is intentional: the jq output expands to separate
          # `-t <tag>` args, and the printf glob to one digest ref per arch.
          # The hex-only glob rejects any stray file the artifact download
          # might surface (digest filenames are sha256 — 64 lowercase hex
          # chars), so a junk file can't silently become a phantom ref.
          # shellcheck disable=SC2046
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/ivan-malinovski/calino@sha256:%s ' [0-9a-f]*) || exit 1
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Verify manifest list
        run: docker buildx imagetools inspect ghcr.io/ivan-malinovski/calino:${{ steps.meta.outputs.version }}
